<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="560" height="560" rx="12" fill="#ffffff"/>
  <!-- software group -->
  <rect x="70" y="16" width="420" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="86" y="38" font-size="12" fill="#57606a">Host (HAOS, HA Container, or Supervised)</text>

  <rect x="120" y="52" width="320" height="52" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="280" y="84" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Home Assistant</text>

  <rect x="120" y="126" width="320" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="152" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Custom ZHA integration</text>
  <text x="280" y="174" font-size="12.5" fill="#1e40af" text-anchor="middle">this repository, installed via HACS</text>

  <rect x="120" y="210" width="320" height="52" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="280" y="242" font-size="15" fill="#1f2328" text-anchor="middle">zha + zigpy</text>

  <rect x="120" y="284" width="320" height="52" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="280" y="306" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">zigpy-blz</text>
  <text x="280" y="325" font-size="12" fill="#57606a" text-anchor="middle">BLZ radio library</text>

  <line x1="280" y1="104" x2="280" y2="124" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="280" y1="188" x2="280" y2="208" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="280" y1="262" x2="280" y2="282" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- USB -->
  <line x1="280" y1="336" x2="280" y2="398" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="292" y="364" font-size="12.5" fill="#1f2328">USB serial</text>
  <text x="292" y="381" font-size="11.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">/dev/serial/by-id/...</text>

  <rect x="120" y="400" width="320" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="426" font-size="16" font-weight="600" fill="#78350f" text-anchor="middle">BL702 / BL706 USB dongle</text>
  <text x="280" y="448" font-size="12.5" fill="#92400e" text-anchor="middle">BLZ coordinator firmware</text>

  <line x1="280" y1="462" x2="280" y2="498" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="292" y="485" font-size="12.5" fill="#57606a">Zigbee 2.4 GHz</text>

  <text x="280" y="526" font-size="15" fill="#1f2328" text-anchor="middle">Zigbee devices</text>
  <text x="280" y="545" font-size="12" fill="#57606a" text-anchor="middle">bulbs, sensors, switches, ...</text>
</svg>
